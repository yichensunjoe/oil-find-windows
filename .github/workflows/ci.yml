name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-local-search:
    name: Build, test and verify (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Go toolchain
        run: go version
      - name: Build, test and package
        shell: pwsh
        run: ./windows/scripts/build.ps1 -GoBin go
      - name: Verify PE subsystem and embedded manifest
        shell: pwsh
        run: python ./windows/scripts/verify-pe.py ./outputs/windows-amd64/OilFindIntranet.exe --arch amd64
      - name: Upload unsigned preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oil-find-intranet-windows-amd64-unsigned
          path: outputs/windows-amd64/
          if-no-files-found: error

  heavy-cache-limit:
    # Manual only: streams MaxEntries+1 entries and needs roughly 950MB RSS.
    # Run it after changing Load/Save limits in windows/internal/index.
    if: github.event_name == 'workflow_dispatch'
    name: Heavy cache-limit check (manual)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Stream the entry limit
        shell: pwsh
        env:
          OILFIND_HEAVY_TESTS: "1"
        run: |
          $env:TEMP = Join-Path $env:RUNNER_TEMP "heavy"
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
          Push-Location windows
          try { go test -count=1 -run TestLoadRejectsStreamOverEntryLimit ./internal/index } finally { Pop-Location }
