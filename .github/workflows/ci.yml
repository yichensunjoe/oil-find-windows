name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rust:
    name: Build, test and verify (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Rust toolchain
        run: |
          rustup show
          cargo --version
      - name: Format check
        working-directory: rust
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --workspace
      - name: Build and package
        shell: pwsh
        run: ./rust/scripts/build.ps1
      - name: Verify PE subsystem and embedded manifest
        shell: pwsh
        run: python ./rust/scripts/verify-pe.py ./outputs/windows-amd64/OilFind.exe --arch amd64
      - name: Upload unsigned preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oil-find-windows-amd64-unsigned
          path: outputs/windows-amd64/
          if-no-files-found: error
