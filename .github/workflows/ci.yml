name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Format, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Rust toolchain
        run: |
          rustup show
          cargo --version
      - name: Format check
        working-directory: rust
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --workspace

  windows:
    name: Windows x64 build, test and package
    runs-on: windows-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Rust toolchain
        run: |
          rustup show
          cargo --version
      - name: Build, test and package
        shell: pwsh
        run: ./rust/scripts/build.ps1
      - name: Verify PE subsystem and embedded manifest
        shell: pwsh
        run: python ./rust/scripts/verify-pe.py ./outputs/windows-amd64/OilFind.exe --arch amd64
      - name: Upload unsigned preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oil-find-windows-amd64-unsigned
          path: outputs/windows-amd64/
          if-no-files-found: error

  macos:
    name: macOS build and test
    runs-on: macos-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Rust toolchain
        run: |
          rustup show
          cargo --version
      - name: Test
        working-directory: rust
        run: cargo test --workspace
      - name: Build the macOS preview app
        working-directory: rust
        run: cargo build --release -p oilfind-mac
      - name: Package the preview app
        run: bash rust/scripts/package-mac.sh
      - name: Upload the macOS preview
        uses: actions/upload-artifact@v7
        with:
          name: oil-find-macos-preview-unsigned
          path: outputs/OilFind-Rust-macOS-preview.zip
          if-no-files-found: error
