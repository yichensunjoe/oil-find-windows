[package]
name = "oilfind-win"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
oilfind-core = { version = "0.1.0", path = "../oilfind-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Windows APIs for sizing, composition, keyboard input and local drive checks.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Com"] }

[build-dependencies]
embed-resource = "3.0.12"
