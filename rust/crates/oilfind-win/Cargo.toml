[package]
name = "oilfind-win"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oilfind-core = { version = "0.1.0", path = "../oilfind-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 追加的 feature 都来自同一个 crate（不引入新依赖）：HiDpi 提供 DPI 接口，
# Storage_FileSystem 提供卷类型校验，Input_KeyboardAndMouse 提供焦点/按键/启用控件。
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Registry"] }

[build-dependencies]
embed-resource = "3.0.12"
