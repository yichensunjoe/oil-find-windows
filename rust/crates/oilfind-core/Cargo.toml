[package]
name = "oilfind-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bincode = "1.3.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
pinyin = "0.11.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[dev-dependencies]
# Both are already in the dependency graph; the integration tests use chrono to
# compute the local "today" that `dm:` is defined against, and serde_json to
# build corrupt cache documents. No new crates are pulled in.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.154"
